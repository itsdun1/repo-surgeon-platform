apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local overlay — kind / minikube / Docker Desktop.
# Optimized for fast iteration: single replica, smaller resources, emptyDir
# Postgres so kind nodes don't need a CSI driver.

namespace: repo-surgeon

resources:
  - ../../base

patches:
  - path: patches/postgres-emptydir.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres

# In local clusters we don't have an ingress controller by default. Surface
# the dashboard + surgeon via NodePort so `kind` users can reach them.
patchesStrategicMerge:
  - patches/services-nodeport.yaml

images:
  - name: repo-surgeon/surgeon-service
    newTag: local
  - name: repo-surgeon/dashboard
    newTag: local
