# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS A TEMPLATE — DO NOT KUSTOMIZE / DO NOT APPLY DIRECTLY.
# It documents the expected shape of the surgeon-secrets and
# surgeon-app-secrets resources.
#
# In production, create these out of band via:
#   - External Secrets Operator + AWS Secrets Manager / GCP Secret Manager / Vault
#   - Sealed Secrets (bitnami-labs/sealed-secrets)
#   - SOPS-encrypted manifests
#
# Never commit real values.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: surgeon-secrets
  namespace: repo-surgeon
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<rotate-via-eso>"
  ANTHROPIC_API_KEY: "<sk-ant-... or empty>"
  OPENAI_API_KEY: "<sk-...>"
  GITHUB_APP_ID: "<numeric app id>"
  GITHUB_WEBHOOK_SECRET: "<openssl rand -hex 32>"
  SMEE_URL: "<https://smee.io/your-channel — only for dev; prod uses real ingress>"
---
apiVersion: v1
kind: Secret
metadata:
  name: surgeon-app-secrets
  namespace: repo-surgeon
type: Opaque
stringData:
  # The GitHub App's PEM private key. Mounted into surgeon at
  # /workspace/secrets/github-app-private-key.pem.
  github-app-private-key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    <pem content here>
    -----END RSA PRIVATE KEY-----
